[advisories]
version = 2
ignore = []

[licenses]
version = 2
# Policy: OSI permissive (MIT/Apache/BSD/ISC/0BSD/Zlib/Unlicense) + weak copyleft (MPL-2.0)
# + public-domain-equivalent (CDLA-Permissive-2.0) + Boost (BSL-1.0) + Unicode-3.0.
# Strong copyleft (GPL/AGPL/LGPL) is implicitly rejected by omission.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "MPL-2.0",
    "Unlicense",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[package]
name = "scout"
version = "2.4.0"
edition = "2024"
rust-version = "1.97.1"
description = "CLI tool for web search (Brave Search), page fetching, and GitHub repository exploration"
license = "MIT"
repository = "https://github.com/thkt/scout"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.13", features = ["json", "gzip", "brotli", "deflate", "zstd"] }
dom_smoothie = "0.18"
htmd = "0.5.5"
# htmd re-exports only `Node`, so the handlers in src/fetch/converter.rs read
# the DOM through this crate's `NodeData`. Pinned to the version htmd itself
# depends on, so the two resolve to one crate and the node types stay
# identical.
#
# That leaves html5ever and markup5ever duplicated one level down, where
# dom_smoothie pulls 0.39 of both, and `cargo deny check` warns per crate. We
# leave those warnings rather than skipping them, and do not chase the
# duplication: `TreeBuilder<Handle, Sink>` and `Tokenizer<Sink>` monomorphize
# on the sink type, so htmd (RcDom) and dom_smoothie (dom_query sink) keep
# their own copy of the parser code whichever version they share. Aligning
# removes the two warnings, not the two code sets (measured in issue #379).
#
# renovate.json holds this crate at `allowedVersions: "<0.39"` so it cannot be
# raised past htmd on its own. Bump this pin and drop that bound together once
# htmd moves, or renovate stops offering updates for the crate entirely.
markup5ever_rcdom = "0.38"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
futures = "0.3"
base64 = "0.23"
globset = "0.4"
percent-encoding = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
encoding_rs = "0.8"
chardetng = "1"
fastrand = "2"
httpdate = "1"
chromiumoxide = { version = "0.9", optional = true }
nix = { version = "0.31", features = ["signal"], optional = true }
tempfile = { version = "3", optional = true }

[features]
js-rendering = ["chromiumoxide", "nix", "tempfile"]

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tracing-test = "0.2"
wiremock = "0.6"
flate2 = "1"

[lints.rust]
unsafe_code = "forbid"
# `lib::run` is the crate's only external entry point, so a `pub` anywhere
# else claims a reach it does not have. Fields are outside this lint's scope.
unreachable_pub = "deny"

[lints.clippy]
# absolute paths
absolute_paths = "deny"
# casts
cast_possible_truncation = "deny"
cast_precision_loss = "deny"
# idiomatic iterators
redundant_closure_for_method_calls = "deny"
filter_map_next = "deny"
flat_map_option = "deny"
manual_filter_map = "deny"
manual_find_map = "deny"
# imports
wildcard_imports = "deny"
enum_glob_use = "deny"
# strings
str_to_string = "deny"
# arguments
needless_pass_by_value = "deny"
# uncapped reads (list and rationale in clippy.toml)
disallowed_methods = "deny"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[package]
name = "scout"
version = "2.6.3"
edition = "2024"
rust-version = "1.99.1"
description = "CLI tool for web search (Brave Search), page fetching, and GitHub repository exploration"
license = "MIT"
repository = "https://github.com/thkt/scout"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.13", features = ["json", "gzip", "brotli", "deflate", "zstd"] }
dom_smoothie = "0.18"
# Keep the parser aligned with dom_query's TreeSink API.
dom_query = { version = "0.29", default-features = false }
html5ever = "0.40.1"
# `full` also pulls `fs` (no call site) and `parking_lot` (swaps tokio's
# internal Mutex). The list below is what the crate actually calls; adding a
# call site for a feature outside it fails to compile, which is the signal we
# want over a silent dependency.
tokio = { version = "1", features = [
  "io-std",
  "io-util",
  "macros",
  "net",
  "process",
  "rt",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
futures = "0.3"
base64 = "0.23"
globset = "0.4"
percent-encoding = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
encoding_rs = "0.8"
chardetng = "1"
fastrand = "2"
httpdate = "1"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect"], optional = true }
nix = { version = "0.31", features = ["signal"], optional = true }
tempfile = { version = "3", optional = true }
pulldown-cmark = { version = "0.13.4", default-features = false }

[features]
js-rendering = ["tokio-tungstenite", "nix", "tempfile"]

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tracing-test = "0.2"
wiremock = "0.6"
flate2 = "1"

[lints.rust]
unsafe_code = "forbid"
# `lib::run` is the crate's only external entry point, so a `pub` anywhere
# else claims a reach it does not have. Fields are outside this lint's scope.
unreachable_pub = "deny"

[lints.clippy]
absolute_paths = "deny"
cast_possible_truncation = "deny"
cast_precision_loss = "deny"
redundant_closure_for_method_calls = "deny"
filter_map_next = "deny"
flat_map_option = "deny"
manual_filter_map = "deny"
manual_find_map = "deny"
wildcard_imports = "deny"
enum_glob_use = "deny"
str_to_string = "deny"
needless_pass_by_value = "deny"
# uncapped reads (list and rationale in clippy.toml)
disallowed_methods = "deny"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

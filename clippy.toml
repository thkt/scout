# The success path was guarded by a cap while the error path called `text()` and
# read whatever the server sent. The helpers in `src/body_limit.rs` are the fix,
# and this lint keeps a later edit from routing around them. A lint rather than a
# test because neither caller makes the cap observable: both truncate the
# diagnostic again before it reaches the output, so a reintroduced `text()` would
# pass every test. It fails the build instead.
#
# Tests that read a body they themselves served are the exception and carry a
# local `#[expect(clippy::disallowed_methods, reason = "...")]`.
disallowed-methods = [
  { path = "reqwest::Response::text", reason = "reads the whole body; use body_limit::read_body_capped for a payload or read_body_snippet for a diagnostic" },
  { path = "reqwest::Response::bytes", reason = "reads the whole body; use body_limit::read_body_capped for a payload or read_body_snippet for a diagnostic" },
  { path = "reqwest::Response::json", reason = "reads the whole body; use body_limit::read_body_capped, then serde_json::from_slice" },
]

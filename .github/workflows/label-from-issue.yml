name: Apply labels from issue form

on:
  issues:
    types:
      - opened
      - edited

permissions:
  contents: read
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # bug.yml and feature.yml declare the same Priority dropdown, and
      # advanced-issue-labeler.yml maps both to one policy. The parser does not
      # fail on a body written from the other form, so a parse/label pair per
      # form ran both pairs on every issue. One pair covers both forms.
      - name: Parse issue form
        id: parse
        uses: stefanbuck/github-issue-parser@cb6e97157cbf851e3a393ff8d57c93a484cc323f # v3
        with:
          template-path: .github/ISSUE_TEMPLATE/bug.yml
        continue-on-error: true

      - name: Apply priority label
        if: steps.parse.outcome == 'success'
        uses: redhat-plumbers-in-action/advanced-issue-labeler@b80ae64e3e156e9c111b075bfa04b295d54e8e2e # v3.2.4
        with:
          issue-form: ${{ steps.parse.outputs.jsonString }}
          template: bug.yml
          section: priority
          token: ${{ secrets.GITHUB_TOKEN }}

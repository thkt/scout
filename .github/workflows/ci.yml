name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The loopback-binding helpers (src/test_support.rs, tests/common/mod.rs) skip
# their scenario when the bind fails, and nextest hides a passing test's stderr.
# A runner that lost loopback would therefore report the proxy-driven suites
# green with no assertion executed. Local runs keep that skip; CI does not.
env:
  SCOUT_NETWORK_TESTS: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check
        run: cargo check

      - name: Check (js-rendering)
        run: cargo check --features js-rendering

      - name: Install nextest
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest

      - name: Test
        run: cargo nextest run --profile ci

      # --run-ignored all runs every #[ignore] test, not only the chromium-gated
      # one, so a runner missing chromium fails here instead of skipping silently.
      - name: Test (js-rendering)
        run: cargo nextest run --features js-rendering --run-ignored all --profile ci

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Format check
        run: cargo fmt -- --check

      - name: Comment language check
        run: |
          hits=$(grep -rnE '//' src tests --include='*.rs' \
            | sed -E 's/"[^"]*"//g; s/'"'"'.'"'"'//g' \
            | grep -E '//.*[ぁ-ゖァ-ヺー々〜、。「」一-鿿]' || true)
          if [ -n "$hits" ]; then
            echo "Comments must be written in English (.claude/rules/CONVENTIONS.md)."
            echo "Only a quoted original-language fragment may remain, as in: // \"テスト\" in Shift_JIS"
            echo "$hits"
            exit 1
          fi
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov

      # Without -- --include-ignored the chromium-gated full-tunnel path drops
      # out of lcov.info and the diff-cover gate below stops covering it.
      - name: Generate coverage
        run: cargo llvm-cov --features js-rendering --lcov --output-path lcov.info -- --include-ignored

      - name: Diff coverage gate
        run: |
          python3 -m venv .venv
          .venv/bin/pip install diff-cover
          # Exclude only the proxy's OS-dependent transport layer
          # (proxy/transport.rs): the accept loop, upstream dial, and byte tunnel.
          # T-201-13 checks a refused loopback dial's failure reply. Accept faults,
          # black-hole dial timeouts, and tunnel resets need other socket faults.
          # The SOCKS5 protocol layer (proxy.rs) stays on the global gate.
          .venv/bin/diff-cover lcov.info --compare-branch=origin/main \
            --exclude '*/fetch/cdp/proxy/transport.rs' --fail-under=95
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-targets: false

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Install cargo-machete
        run: cargo install cargo-machete --locked

      - name: Deny check
        run: cargo deny check

      - name: Audit
        run: cargo audit

      # --with-metadata resolves package name -> lib name. Without it, a crate
      # whose lib name differs from its package name is reported as unused.
      - name: Unused dependencies
        run: cargo machete --with-metadata
